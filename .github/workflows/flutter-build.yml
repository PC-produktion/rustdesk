name: Build the flutter version of the RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: 'C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/vcpkg'
      VCPKGRS_DYNAMIC: '0'
      LIBCLANG_PATH: 'C:/Program Files/LLVM/bin'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          choco install llvm cmake ninja pkgconfiglite -y

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg dependencies (Manifest Mode)
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows-static

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Locate and Build WindowInjection.dll
        shell: powershell
        run: |
          Write-Host "Suche nach WindowInjection Dateien im Repository:"
          Get-ChildItem -Recurse -Filter "*WindowInjection*" | Select-Object FullName

          # 1. Prüfen ob .vcxproj oder .sln existiert
          $proj = Get-ChildItem -Recurse -Filter "*WindowInjection*.vcxproj" | Select-Object -First 1
          if ($proj) {
              msbuild $proj.FullName /p:Configuration=Release /p:Platform=x64
          }

          # 2. Prüfen ob CMakeLists.txt in einem WindowInjection-Ordner existiert
          $cmakeDir = Get-ChildItem -Recurse -Directory -Filter "*WindowInjection*" | Select-Object -First 1
          if ($cmakeDir -and (Test-Path "$($cmakeDir.FullName)\CMakeLists.txt")) {
              cmake -S $cmakeDir.FullName -B "$($cmakeDir.FullName)\build" -A x64
              cmake --build "$($cmakeDir.FullName)\build" --config Release
          }

      - name: Prepare Flutter Dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Generate Bridge Code
        run: |
          cd flutter
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart

      - name: Build Rust Engine and Flutter App
        env:
          RUSTFLAGS: '-L native=${{ github.workspace }}/vcpkg_installed/x64-windows-static/lib'
          BINDGEN_EXTRA_CLANG_ARGS: '-I"${{ github.workspace }}/vcpkg_installed/x64-windows-static/include" -target x86_64-pc-windows-msvc'
        run: |
          cargo build --release
          cd flutter
          flutter build windows --release

      - name: Bundle Executable & DLLs
        shell: powershell
        run: |
          if (Test-Path "release_dist") { Remove-Item -Path "release_dist" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path release_dist

          # 1. Flutter Release als Basis
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
              Copy-Item -Path "flutter/build/windows/x64/runner/Release\*" -Destination "release_dist" -Recurse -Force
          }

          # 2. Rust-Engine & alle gefundenen WindowInjection-DLLs kopieren
          if (Test-Path "target/release/librustdesk.dll") {
              Copy-Item -Path "target/release/librustdesk.dll" -Destination "release_dist" -Force
          }
          Get-ChildItem -Recurse -Filter "*WindowInjection*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -Path $_.FullName -Destination "release_dist\WindowInjection.dll" -Force
          }

          # 3. Alle Flutter-Plugins mitkopieren
          Get-ChildItem -Path "flutter/build/windows/x64/plugins" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "release_dist" -Force

          # Kontrolle im Log ausgeben
          Get-ChildItem "release_dist" | Select-Object Name, Length

      - name: Upload Complete Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-complete
          path: release_dist/
