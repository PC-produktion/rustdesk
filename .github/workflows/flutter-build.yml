name: Procine Remote macOS Build

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Mac Architektur (x86_64 für Intel MacBook Pro, aarch64 für M1/M2/M3/M4)'
        required: true
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - aarch64

env:
  CUSTOM_APP_NAME: "Procine Remote"
  RENDEZVOUS_SERVER: "52.50.230.112"
  RS_PUB_KEY: "cAgyQkD6UEZ559beJIytYbIPnqdGtw42GQP36LuvUcU="
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply Final Branding, Server, Large Logo & Remove Banners
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $utf8 = New-Object System.Text.UTF8Encoding($false)

          # 1. Produktname, AWS-Server & Public Key in src/ UND libs/ einkompilieren
          Get-ChildItem -Path "src", "libs" -Recurse -Include "*.rs" -ErrorAction SilentlyContinue | ForEach-Object {
              $content = [System.IO.File]::ReadAllText($_.FullName, $utf8)
              $orig = $content
              $content = $content -replace '(APP_NAME\s*:\s*&str\s*=\s*)"RustDesk"', "`$1`"$env:CUSTOM_APP_NAME`""
              $content = $content -replace '(APP_NAME\s*=\s*)"RustDesk"', "`$1`"$env:CUSTOM_APP_NAME`""
              $content = $content -replace '(RENDEZVOUS_SERVERS\s*:\s*&\[&str\]\s*=\s*&\[)[^\]]*(\])', "`$1`"$env:RENDEZVOUS_SERVER`"`$2"
              $content = $content -replace 'rs-ny\.rustdesk\.com', "$env:RENDEZVOUS_SERVER"
              $content = $content -replace '(RS_PUB_KEY\s*:\s*&str\s*=\s*)"[^"]*"', "`$1`"$env:RS_PUB_KEY`""
              if ($content -ne $orig) {
                  [System.IO.File]::WriteAllText($_.FullName, $content, $utf8)
                  Write-Host "OK: Server/Key/Name aktualisiert in $($_.FullName)"
              }
          }

          # 2. macOS App-Namen in Info.plist & xcconfig anpassen
          Get-ChildItem -Path "flutter/macos" -Recurse -Include "*.plist", "*.xcconfig", "*.pbxproj" -ErrorAction SilentlyContinue | ForEach-Object {
              $macTxt = [System.IO.File]::ReadAllText($_.FullName, $utf8)
              $macOrig = $macTxt
              $macTxt = $macTxt -replace '>RustDesk<', ">$env:CUSTOM_APP_NAME<"
              $macTxt = $macTxt -replace 'PRODUCT_NAME = RustDesk', "PRODUCT_NAME = $env:CUSTOM_APP_NAME"
              if ($macTxt -ne $macOrig) {
                  [System.IO.File]::WriteAllText($_.FullName, $macTxt, $utf8)
              }
          }

          # 3. Update-Checks in Rust & Dart komplett abschalten
          Get-ChildItem -Path "src", "libs", "flutter/lib" -Recurse -Include "*.rs", "*.dart" -ErrorAction SilentlyContinue | ForEach-Object {
              $txt = [System.IO.File]::ReadAllText($_.FullName, $utf8)
              $orig = $txt
              $txt = $txt -replace 'https://api\.github\.com/repos/rustdesk/rustdesk/releases/latest', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://rustdesk\.com/api/version', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://rustdesk\.com/api/latest', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://api\.rustdesk\.com/version/latest', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://github\.com/rustdesk/rustdesk/releases/latest', 'http://127.0.0.1:0/disabled'
              if ($txt -ne $orig) {
                  [System.IO.File]::WriteAllText($_.FullName, $txt, $utf8)
              }
          }

          # 4. Großes PROCINÉ-Logo einbinden
          if (-not (Test-Path "flutter/assets/brand_logo.png")) {
              Write-Error "FEHLER: flutter/assets/brand_logo.png fehlt!"
          }
          $pubspecPath = (Resolve-Path "flutter/pubspec.yaml").Path
          $pubspec = [System.IO.File]::ReadAllText($pubspecPath, $utf8)
          if ($pubspec -notmatch 'assets/brand_logo\.png') {
              $pubspec = $pubspec -replace '(assets:\s*\r?\n)', "`$1    - assets/brand_logo.png`n"
              [System.IO.File]::WriteAllText($pubspecPath, $pubspec, $utf8)
          }

          $homePagePath = (Resolve-Path "flutter/lib/desktop/pages/desktop_home_page.dart").Path
          $ui = [System.IO.File]::ReadAllText($homePagePath, $utf8)
          $m = [regex]::Match($ui, "Text\(\s*translate\(['`"]Your Desktop['`"]\)")
          if ($m.Success) {
              $start = $m.Index
              $depth = 0
              $end = -1
              for ($i = $start + 4; $i -lt $ui.Length; $i++) {
                  $ch = $ui[$i]
                  if ($ch -eq '(') {
                      $depth++
                  }
                  elseif ($ch -eq ')') {
                      $depth--
                      if ($depth -eq 0) {
                          $end = $i
                          break
                      }
                  }
              }
              if ($end -gt $start) {
                  $fullTextWidget = $ui.Substring($start, $end - $start + 1)
                  $replacement = "Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [Padding(padding: const EdgeInsets.only(bottom: 14.0), child: SizedBox(width: 200, child: Image.asset('assets/brand_logo.png', fit: BoxFit.fitWidth))), $fullTextWidget])"
                  $ui = $ui.Remove($start, $end - $start + 1).Insert($start, $replacement)
              }
          }

          # Pinkes Help-/Install-/LowerVersion-Banner in desktop_home_page.dart abschalten
          $ui = $ui -replace 'buildHelpCards\(stateGlobal\.updateUrl\.value\)', 'const SizedBox.shrink()'
          $ui = $ui -replace 'bind\.mainIsInstalledLowerVersion\(\)', 'false'
          $ui = $ui -replace 'bind\.mainIsInstalled\(\)', 'true'
          [System.IO.File]::WriteAllText($homePagePath, $ui, $utf8)

          # 5. Komma in connection_page.dart entfernen
          $connPagePath = (Resolve-Path "flutter/lib/desktop/pages/connection_page.dart").Path
          $connCode = [System.IO.File]::ReadAllText($connPagePath, $utf8)
          $connCode = $connCode -replace "Text\(', ',\s*style:\s*TextStyle\(fontSize:\s*em\)\)", "const SizedBox.shrink()"
          [System.IO.File]::WriteAllText($connPagePath, $connCode, $utf8)

          # Alle .dart-Dateien nach Update-Flags & Server-Tipps bereinigen
          Get-ChildItem -Path "flutter/lib" -Recurse -Include "*.dart" | ForEach-Object {
              $dart = [System.IO.File]::ReadAllText($_.FullName, $utf8)
              $dOrig = $dart
              $isLangFile = $_.FullName -match "[\\/]langs[\\/]"

              $dart = $dart -replace 'newVersion\.isNotEmpty', 'false'
              $dart = $dart -replace 'newVersion\.value\.isNotEmpty', 'false'
              $dart = $dart -replace 'stateGlobal\.newVersion\.value\.isNotEmpty', 'false'
              $dart = $dart -replace 'stateGlobal\.updateUrl\.value\.isNotEmpty', 'false'
              $dart = $dart -replace 'bind\.mainIsInstalledLowerVersion\(\)', 'false'
              $dart = $dart -replace "Future(?:<String>)?\.value\(''\)", "''"
              $dart = $dart -replace 'await\s+bind\.mainGetNewVersion\(\)', "''"
              $dart = $dart -replace 'bind\.mainGetNewVersion\(\)', "Future.value('')"
              $dart = $dart -replace 'bind\.mainIsInstalled\(\)', 'true'
              $dart = $dart -replace 'isInstalled\.value', 'true'

              if (-not $isLangFile) {
                  $dart = $dart -replace "translate\(\s*['`"]for faster connection, please setup your own server['`"]\s*\)", "''"
                  $dart = $dart -replace "translate\(\s*['`"]setup_server_tip['`"]\s*\)", "''"
              }

              if ($dart -ne $dOrig) {
                  [System.IO.File]::WriteAllText($_.FullName, $dart, $utf8)
              }
          }
          Write-Host "OK: Alle macOS-Anpassungen angewendet."

      - name: Install System Dependencies (Homebrew)
        run: |
          brew update
          brew install ninja cmake pkg-config nasm yasm llvm create-dmg

      - name: Setup vcpkg dependencies
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          ARCH="${{ github.event.inputs.arch || 'x86_64' }}"
          if [ "$ARCH" = "aarch64" ]; then
            TRIPLET="arm64-osx"
          else
            TRIPLET="x64-osx"
          fi
          echo "VCPKG_TRIPLET=$TRIPLET" >> $GITHUB_ENV
          $HOME/vcpkg/vcpkg install --triplet $TRIPLET libvpx libyuv opus aom

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "3.24.0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Prepare Flutter Dependencies & Bridge
        run: |
          cd flutter
          flutter pub get
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart

      - name: Build Rust Engine and Flutter macOS App
        run: |
          ARCH="${{ github.event.inputs.arch || 'x86_64' }}"
          TARGET="${ARCH}-apple-darwin"
          export VCPKG_ROOT="$HOME/vcpkg"
          export RUSTFLAGS="-L native=$HOME/vcpkg/installed/$VCPKG_TRIPLET/lib"
          export BINDGEN_EXTRA_CLANG_ARGS="-I$HOME/vcpkg/installed/$VCPKG_TRIPLET/include --target=$TARGET"

          cargo build --release --lib --features flutter --target $TARGET

          mkdir -p flutter/macos/Frameworks
          cp "target/$TARGET/release/librustdesk.dylib" flutter/macos/Frameworks/

          cd flutter
          flutter build macos --release

      - name: Package macOS DMG
        run: |
          ARCH="${{ github.event.inputs.arch || 'x86_64' }}"
          mkdir -p release_macos
          APP_PATH=$(find flutter/build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -n 1)
          echo "Gefundene App: $APP_PATH"
          cp -R "$APP_PATH" release_macos/
          hdiutil create -volname "Procine Remote" -srcfolder release_macos -ov -format UDZO "Procine-Remote-macOS-${ARCH}.dmg"
          mkdir -p upload_dmg
          mv "Procine-Remote-macOS-${ARCH}.dmg" upload_dmg/

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: procine-remote-macos-${{ github.event.inputs.arch || 'x86_64' }}
          path: upload_dmg/
