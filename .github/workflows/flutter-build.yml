name: Build the flutter version of the RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install LLVM / Clang
        run: choco install llvm -y

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Prepare Flutter Dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Generate Bridge Code
        run: |
          cd flutter
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart

      - name: Build Flutter Executable Target
        env:
          VCPKG_ROOT: 'C:/vcpkg'
        run: |
          cd flutter
          flutter build windows --release --config-only
          cmake --build build/windows/x64 --config Release --target rustdesk

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-custom
          path: flutter/build/windows/x64/runner/Release/*
