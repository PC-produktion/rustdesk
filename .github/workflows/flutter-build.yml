- name: Apply Custom Branding, Logo, Server & Disable Update Check
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # 1. Produktname in src/common.rs auf Procine Remote ändern
          $commonRs = "src/common.rs"
          if (Test-Path $commonRs) {
              $content = Get-Content $commonRs -Raw -Encoding UTF8
              $content = $content -replace '(APP_NAME\s*:\s*&str\s*=\s*)"RustDesk"', "`$1`"$env:CUSTOM_APP_NAME`""
              $content = $content -replace '(APP_NAME\s*=\s*)"RustDesk"', "`$1`"$env:CUSTOM_APP_NAME`""
              Set-Content $commonRs -Value $content -Encoding UTF8
              Write-Host "OK: src/common.rs aktualisiert."
          }

          # 2. Windows Fenstertitel anpassen
          $mainCpp = "flutter/windows/runner/main.cpp"
          if (Test-Path $mainCpp) {
              $cpp = Get-Content $mainCpp -Raw -Encoding UTF8
              $cpp = $cpp -replace 'L"RustDesk"', "L`"$env:CUSTOM_APP_NAME`""
              Set-Content $mainCpp -Value $cpp -Encoding UTF8
              Write-Host "OK: main.cpp aktualisiert."
          }

          # 3. Update-Banner ("Neue Version verfügbar") im Rust- & Flutter-Code deaktivieren
          $updateHits = 0
          Get-ChildItem -Path "src", "flutter/lib" -Recurse -Include "*.rs", "*.dart" | ForEach-Object {
              $txt = Get-Content $_.FullName -Raw -Encoding UTF8
              $orig = $txt
              $txt = $txt -replace 'https://api\.github\.com/repos/rustdesk/rustdesk/releases/latest', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://rustdesk\.com/api/version', 'http://127.0.0.1:0/disabled'
              $txt = $txt -replace 'https://api\.rustdesk\.com/version/latest', 'http://127.0.0.1:0/disabled'
              if ($txt -ne $orig) {
                  Set-Content $_.FullName -Value $txt -Encoding UTF8
                  $updateHits++
                  Write-Host "OK: Update-Check deaktiviert in $($_.Name)"
              }
          }
          Write-Host "Update-URLs ersetzt: $updateHits"

          # 4. Großes Logo (flutter/assets/brand_logo.png) als saubere Column über "Your Desktop" einbinden
          if (-not (Test-Path "flutter/assets/brand_logo.png")) {
              Write-Error "FEHLER: flutter/assets/brand_logo.png wurde im Repository nicht gefunden!"
          }

          $pubspec = Get-Content "flutter/pubspec.yaml" -Raw -Encoding UTF8
          if ($pubspec -notmatch 'assets/brand_logo\.png') {
              $pubspec = $pubspec -replace '(assets:\s*\r?\n)', "`$1    - assets/brand_logo.png`r`n"
              Set-Content "flutter/pubspec.yaml" -Value $pubspec -Encoding UTF8
              Write-Host "OK: brand_logo.png in pubspec.yaml eingetragen."
          }

          $homePage = "flutter/lib/desktop/pages/desktop_home_page.dart"
          $ui = Get-Content $homePage -Raw -Encoding UTF8
          $pattern = "Text\(\s*translate\(['`"]Your Desktop['`"]\)[^\)]*\)"
          if ($ui -match $pattern) {
              $matchedText = $Matches[0]
              $replacement = "Column(mainAxisSize: MainAxisSize.min, crossAxisAlignment: CrossAxisAlignment.start, children: [Padding(padding: const EdgeInsets.only(bottom: 12.0), child: Image.asset('assets/brand_logo.png', height: 48, fit: BoxFit.contain)), $matchedText])"
              $ui = $ui -replace [regex]::Escape($matchedText), $replacement
              Set-Content $homePage -Value $ui -Encoding UTF8
              Write-Host "OK: Großes Logo als Column eingefügt in $homePage"
          } else {
              Write-Error "FEHLER: Text(translate('Your Desktop')) nicht in $homePage gefunden!"
          }
