name: Build the flutter version of the RustDesk

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          choco install llvm cmake ninja pkgconfiglite -y

      - name: Setup Visual Studio Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg dependencies (Manifest Mode)
        run: |
          vcpkg integrate install
          vcpkg install --triplet x64-windows

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.24.x'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install flutter_rust_bridge_codegen
        run: cargo install flutter_rust_bridge_codegen --version 1.80.1

      - name: Prepare Flutter Dependencies
        run: |
          cd flutter
          flutter pub get

      - name: Generate Bridge Code
        run: |
          cd flutter
          flutter_rust_bridge_codegen --rust-input ../src/flutter_ffi.rs --dart-output lib/generated_bridge.dart

      - name: Build Rust Engine and Flutter App
        env:
          VCPKG_ROOT: 'C:/vcpkg'
        run: |
          cargo build --release
          cd flutter
          flutter build windows --release

      - name: Bundle Executable & DLLs
        shell: powershell
        run: |
          if (Test-Path "release_dist") { Remove-Item -Path "release_dist" -Recurse -Force }
          New-Item -ItemType Directory -Force -Path release_dist

          # 1. Gesamten Flutter Release-Ordner inkl. Unterordner (data/flutter_assets) kopieren
          if (Test-Path "flutter/build/windows/x64/runner/Release") {
              Copy-Item -Path "flutter/build/windows/x64/runner/Release\*" -Destination "release_dist" -Recurse -Force
          }

          # 2. Rust binary einfügen
          if (Test-Path "target/release/rustdesk.exe") {
              Copy-Item -Path "target/release/rustdesk.exe" -Destination "release_dist" -Force
          }

          # 3. Ergänzende DLLs kopieren
          Get-ChildItem -Path "flutter/build/windows/x64/plugins" -Filter "*.dll" -Recurse -ErrorAction SilentlyContinue | Copy-Item -Destination "release_dist" -Force

      - name: Upload Complete Windows Client
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-windows-complete
          path: release_dist/
